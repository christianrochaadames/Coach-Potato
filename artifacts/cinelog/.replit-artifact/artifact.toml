kind = "web"
previewPath = "/"
title = "CineLog"
version = "1.0.0"
id = "artifacts/cinelog"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21396

[services.development]
run = "pnpm --filter @workspace/cinelog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cinelog", "run", "build" ]
serve = "static"
publicDir = "artifacts/cinelog/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21396"
BASE_PATH = "/"
