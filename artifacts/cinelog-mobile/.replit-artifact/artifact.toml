kind = "mobile"
previewPath = "/cinelog-mobile"
title = "Spud Mobile"
version = "1.0.0"
id = "artifacts/cinelog-mobile"
router = "path"

[[services]]
name = "Expo"
paths = [ "/cinelog-mobile" ]
localPort = 8099

[services.development]
run = "pnpm --filter @workspace/cinelog-mobile run dev"

[services.development.health.startup]
path = "/status"

[services.env]
PORT = "8099"
BASE_PATH = "/cinelog-mobile"
EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY = "$CLERK_PUBLISHABLE_KEY"
EXPO_PUBLIC_DOMAIN = "$REPLIT_DEV_DOMAIN"
