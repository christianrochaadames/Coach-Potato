openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CouchPotato - Personal movie and TV show tracker
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Movie and TV show log entries
  - name: stats
    description: Viewing statistics
  - name: tmdb
    description: TMDB proxy for search and discovery
  - name: buddies
    description: Mutually-consented buddy relationships and privacy-safe buddy activity

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List all log entries
      parameters:
        - name: year
          in: query
          schema:
            type: integer
          description: Filter by year watched
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, show]
          description: Filter by type
        - name: search
          in: query
          schema:
            type: string
          description: Search by title
        - name: minRating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Minimum rating filter
        - name: status
          in: query
          schema:
            type: string
            enum: [watching, plan_to_watch, completed]
          description: Filter by watch status
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Log a new movie or show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/status:
    post:
      operationId: upsertEntryStatus
      tags: [entries]
      summary: Upsert a user's status for a TMDB title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryStatusInput"
      responses:
        "200":
          description: Entry status saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/by-tmdb/{tmdbId}:
    delete:
      operationId: deleteEntryByTmdbId
      tags: [entries]
      summary: Remove a user's status for a TMDB title
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Entry status removed
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateEntry
      tags: [entries]
      summary: Update an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Entry deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get viewing stats for a year
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
          description: Year to compute stats for
      responses:
        "200":
          description: Year statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearStats"

  /years:
    get:
      operationId: listYears
      tags: [entries]
      summary: List all years that have entries
      responses:
        "200":
          description: List of years with entry counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YearSummary"

  /tmdb/search:
    get:
      operationId: tmdbSearch
      tags: [tmdb]
      summary: Search TMDB for movies and TV shows
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbSearchResponse"
        "503":
          description: TMDB API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tmdb/trending:
    get:
      operationId: tmdbTrending
      tags: [tmdb]
      summary: Get trending movies and shows from TMDB
      responses:
        "200":
          description: Trending results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbSearchResponse"
        "503":
          description: TMDB API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tmdb/popular:
    get:
      operationId: tmdbPopular
      tags: [tmdb]
      summary: Get popular movies and shows from TMDB
      responses:
        "200":
          description: Popular results split by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbPopularResponse"
        "503":
          description: TMDB API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tmdb/movie/{id}:
    get:
      operationId: tmdbMovieDetail
      tags: [tmdb]
      summary: Get movie details including cast and director from TMDB
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: TMDB movie ID
      responses:
        "200":
          description: Movie details with cast and director
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbDetail"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: TMDB upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: TMDB API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tmdb/movie/{id}/providers:
    get:
      operationId: tmdbMovieProviders
      tags: [tmdb]
      summary: Get streaming availability for a movie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: TMDB movie ID
        - name: region
          in: query
          schema:
            type: string
            default: US
          description: Two-letter ISO 3166-1 region code (e.g. US, GB)
      responses:
        "200":
          description: Watch provider data for the requested region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchProviders"
        "400":
          description: Invalid id
        "502":
          description: TMDB upstream error
        "503":
          description: TMDB API key not configured

  /tmdb/tv/{id}/providers:
    get:
      operationId: tmdbTvProviders
      tags: [tmdb]
      summary: Get streaming availability for a TV show
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: TMDB TV show ID
        - name: region
          in: query
          schema:
            type: string
            default: US
          description: Two-letter ISO 3166-1 region code (e.g. US, GB)
      responses:
        "200":
          description: Watch provider data for the requested region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchProviders"
        "400":
          description: Invalid id
        "502":
          description: TMDB upstream error
        "503":
          description: TMDB API key not configured

  /tmdb/tv/{id}:
    get:
      operationId: tmdbTvDetail
      tags: [tmdb]
      summary: Get TV show details including cast and creator from TMDB
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: TMDB TV show ID
      responses:
        "200":
          description: TV show details with cast and creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbDetail"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: TMDB upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: TMDB API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /buddies/facebook:
    get:
      operationId: getFacebookConnection
      tags: [buddies]
      summary: Get optional Facebook connection and identity-only friend matches
      description: Matches are members who also connected Facebook to Spud. Connecting never sends buddy requests or shares protected shelves.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 30 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Configuration, connection state, and one page of matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookConnection"
        "401":
          description: Authentication required
    delete:
      operationId: disconnectFacebook
      tags: [buddies]
      summary: Delete Facebook connection and discovery data without removing buddies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection and discovery data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyDeleteResult"
        "401":
          description: Authentication required

  /buddies/facebook/connect:
    post:
      operationId: beginFacebookConnection
      tags: [buddies]
      summary: Begin a consent-based Facebook OAuth connection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookConnectionInput"
      responses:
        "200":
          description: Open this authorization URL in the system browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookAuthorization"
        "401":
          description: Authentication required
        "503":
          description: Facebook integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelFacebookConnection
      tags: [buddies]
      summary: Cancel pending Facebook authorization without disconnecting an existing link
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending authorization cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyDeleteResult"
        "401":
          description: Authentication required

  /buddies/search:
    get:
      operationId: searchBuddies
      tags: [buddies]
      summary: Search profiles to invite as buddies
      description: Authenticated case-insensitive partial search; excludes self and returns at most 20 identity-only results in a results array, each with relationship status.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 50
      responses:
        "200":
          description: Matching identities and relationship states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddySearchResponse"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required

  /buddies:
    get:
      operationId: listBuddies
      tags: [buddies]
      summary: List accepted and pending buddy relationships
      description: Returns separate accepted, incoming-request, and outgoing-request lists containing identity fields and relationship status only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Buddy relationship lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyLists"
        "401":
          description: Authentication required

  /buddies/{userId}/entries:
    get:
      operationId: getBuddyEntries
      tags: [buddies]
      summary: List a buddy's privacy-safe entry cards
      description: Accepted relationship required. Only title, type, TMDB id, status, and poster are returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuddyUserId"
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [watching, plan_to_watch, completed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated privacy-safe entry cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyEntriesPage"
        "400":
          description: Invalid status or pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
        "403":
          description: An accepted buddy relationship is required
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /buddies/{userId}/request:
    post:
      operationId: requestBuddy
      tags: [buddies]
      summary: Send a buddy request
      description: Creates a pending request. The target must accept it before private activity is shared.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuddyUserId"
      responses:
        "201":
          description: Buddy request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyRelationshipResult"
        "400":
          description: Cannot request yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A relationship or pending request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /buddies/{userId}/accept:
    post:
      operationId: acceptBuddyRequest
      tags: [buddies]
      summary: Accept an incoming buddy request
      description: Only the recipient of a pending request can accept it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuddyUserId"
      responses:
        "200":
          description: Buddy relationship accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyRelationshipResult"
        "401":
          description: Authentication required
        "404":
          description: Profile or incoming request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /buddies/{userId}:
    get:
      operationId: getBuddyProfile
      tags: [buddies]
      summary: Get a profile and, for accepted buddies, favorites and shelves
      description: The person and top-level status are always returned. Bio, favorites, and shelves are present only after both users accept. Each shelf contains a count and at most six privacy-safe BuddyEntry items. No entry notes, ratings, watched dates, tags, or other personal entry fields are exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuddyUserId"
      responses:
        "200":
          description: Person identity/status plus accepted-only bio, favorites, and shelves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyProfileDetail"
        "401":
          description: Authentication required
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeBuddy
      tags: [buddies]
      summary: Cancel, reject, or remove a buddy relationship
      description: Either participant may remove a pending or accepted relationship.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuddyUserId"
      responses:
        "200":
          description: Relationship removed, if present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyDeleteResult"
        "400":
          description: Cannot remove yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
  parameters:
    BuddyUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    FacebookConnectionInput:
      type: object
      required: [returnTo]
      properties:
        returnTo: { type: string, enum: [web, native] }

    FacebookAuthorization:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string, format: uri }

    FacebookConnection:
      type: object
      required: [configured, connected, pending, error, lastSyncedAt, inviteUrl, results, total, limit, offset]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        pending: { type: boolean }
        error: { type: ["string", "null"] }
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        inviteUrl: { type: ["string", "null"], format: uri }
        results:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/BuddySearchProfile"
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }

    BuddyIdentity:
      type: object
      required: [userId, firstName, lastName, username, avatarId, avatarUrl]
      properties:
        userId:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        avatarId:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

    BuddySearchProfile:
      allOf:
        - $ref: "#/components/schemas/BuddyIdentity"
        - type: object
          required: [status]
          properties:
            status:
              $ref: "#/components/schemas/BuddyStatus"

    BuddyStatus:
      type: string
      enum: [none, incoming, outgoing, accepted]

    BuddyPerson:
      allOf:
        - $ref: "#/components/schemas/BuddyIdentity"
        - type: object
          required: [status]
          properties:
            status:
              $ref: "#/components/schemas/BuddyStatus"
            bio:
              type: ["string", "null"]
              description: Present only for accepted buddies.

    BuddySearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/BuddySearchProfile"

    BuddyLists:
      type: object
      required: [accepted, incoming, outgoing]
      properties:
        accepted:
          type: array
          items:
            $ref: "#/components/schemas/BuddyPerson"
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/BuddyPerson"
        outgoing:
          type: array
          items:
            $ref: "#/components/schemas/BuddyPerson"

    BuddyRelationshipResult:
      type: object
      required: [userId, status, direction]
      properties:
        userId:
          type: string
        status:
          type: string
          enum: [pending, accepted]
        direction:
          type: string
          enum: [incoming, outgoing, accepted]

    BuddyShelf:
      type: object
      required: [count, items]
      properties:
        count:
          type: integer
        items:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/BuddyEntryCard"

    BuddyShelves:
      type: object
      required: [watching, plan_to_watch, completed]
      properties:
        watching:
          $ref: "#/components/schemas/BuddyShelf"
        plan_to_watch:
          $ref: "#/components/schemas/BuddyShelf"
        completed:
          $ref: "#/components/schemas/BuddyShelf"

    BuddyFavorites:
      type: object
      required: [tv, movies]
      properties:
        tv:
          type: array
          items:
            $ref: "#/components/schemas/BuddyFavorite"
        movies:
          type: array
          items:
            $ref: "#/components/schemas/BuddyFavorite"

    BuddyFavorite:
      type: object
      required: [title, posterUrl]
      properties:
        title:
          type: string
        posterUrl:
          type: ["string", "null"]

    BuddyProfileDetail:
      type: object
      required: [person, status]
      properties:
        person:
          $ref: "#/components/schemas/BuddyPerson"
        status:
          $ref: "#/components/schemas/BuddyStatus"
        favorites:
          $ref: "#/components/schemas/BuddyFavorites"
        shelves:
          $ref: "#/components/schemas/BuddyShelves"

    BuddyEntryCard:
      type: object
      required: [title, type, tmdbId, status, posterUrl]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [movie, show]
        tmdbId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [watching, plan_to_watch, completed]
        posterUrl:
          type: ["string", "null"]

    BuddyEntriesPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuddyEntryCard"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    BuddyDeleteResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Entry:
      type: object
      required:
        - id
        - title
        - type
        - status
        - year
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [movie, show]
        status:
          type: string
          enum: [watching, plan_to_watch, completed]
          default: completed
        posterUrl:
          type: ["string", "null"]
        dateWatched:
          type: ["string", "null"]
          format: date
        year:
          type: ["integer", "null"]
        rating:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        notes:
          type: ["string", "null"]
        synopsis:
          type: ["string", "null"]
        tmdbId:
          type: ["integer", "null"]
        platform:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
